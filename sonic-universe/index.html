<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEBBEK · Sonic Universe</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#02050e;color:#eafaff;font:14px system-ui}canvas{display:block;width:100%;height:100%}.ui{position:fixed;inset:20px 20px auto;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}.ui>*{pointer-events:auto}h1{font-size:clamp(17px,3vw,30px);letter-spacing:.24em;margin:0}small{color:#75a7ba;letter-spacing:.15em}.controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:calc(100% - 24px)}button{background:#091b2cba;border:1px solid #2f9fc788;color:#eafaff;border-radius:24px;padding:12px 16px;cursor:pointer;backdrop-filter:blur(12px)}button:hover{background:#184467}a{color:#a5eafa;text-decoration:none}</style><canvas id="scene"></canvas><div class="ui"><div><small>IMMERSIVE VISUAL EXPERIENCE</small><h1>KEBBEK</h1><small>SONIC UNIVERSE</small></div><a href="../index.html">← STUDIO</a></div><div class="controls"><button id="mode">MODE: GLOBE</button><button id="pulse">ENERGY BURST</button><button id="sound">ENABLE SOUND</button><button id="music">LOAD MUSIC</button><input id="audio" type="file" accept="audio/*" hidden></div><script>
const c=document.getElementById('scene'),x=c.getContext('2d');let w,h,dpr,points=[],stars=[],mode=0,burst=0,t=0,mouse={x:0,y:0},audioCtx,analyser,source,element,osc,gain,soundOn=false;const modes=['GLOBE','NEBULA','VORTEX','FUSION'];function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);points=Array.from({length:1600},(_,i)=>{let y=1-2*(i+.5)/1600,r=Math.sqrt(1-y*y),a=i*2.399963;return [Math.cos(a)*r,y,Math.sin(a)*r,Math.random()]});stars=Array.from({length:230},()=>[Math.random()*w,Math.random()*h,Math.random()*1.5+.3])}addEventListener('resize',resize);resize();addEventListener('pointermove',e=>{mouse.x=(e.clientX/w-.5)*.5;mouse.y=(e.clientY/h-.5)*.5});function sfx(freq=180){if(!soundOn)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(freq/3,audioCtx.currentTime+.35);g.gain.setValueAtTime(.06,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.4);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.4)}document.getElementById('mode').onclick=()=>{mode=(mode+1)%4;document.getElementById('mode').textContent='MODE: '+modes[mode];sfx(480)};document.getElementById('pulse').onclick=()=>{burst=1;sfx(120)};document.getElementById('sound').onclick=async()=>{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'MUTE SFX':'ENABLE SOUND';if(soundOn)sfx(620)};document.getElementById('music').onclick=()=>document.getElementById('audio').click();document.getElementById('audio').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();if(element){element.pause();URL.revokeObjectURL(element.src)}element=new Audio(URL.createObjectURL(file));element.loop=true;if(!source){source=audioCtx.createMediaElementSource(element);analyser=audioCtx.createAnalyser();analyser.fftSize=256;source.connect(analyser).connect(audioCtx.destination)}else{source.disconnect();source=audioCtx.createMediaElementSource(element);source.connect(analyser)}element.play()};let freq=new Uint8Array(128);function draw(){requestAnimationFrame(draw);t+=.008;let amp=0;if(analyser){analyser.getByteFrequencyData(freq);amp=freq.slice(0,28).reduce((a,b)=>a+b,0)/28/255}x.fillStyle='rgba(2,5,14,.22)';x.fillRect(0,0,w,h);for(let [sx,sy,r] of stars){x.fillStyle='rgba(150,210,255,.35)';x.beginPath();x.arc(sx,sy,r,0,7);x.fill()}let cx=w*.5,cy=h*.47,R=Math.min(w*.32,h*.38,340),rot=t*.32+mouse.x,tilt=.2+mouse.y,energy=1+amp*.65+burst*.5;let glow=x.createRadialGradient(cx,cy,R*.4,cx,cy,R*1.5);glow.addColorStop(0,'rgba(15,95,155,.16)');glow.addColorStop(.7,'rgba(40,130,230,.08)');glow.addColorStop(1,'transparent');x.fillStyle=glow;x.beginPath();x.arc(cx,cy,R*1.5,0,7);x.fill();x.save();x.globalCompositeOperation='lighter';for(let i=0;i<points.length;i++){let [px,py,pz,rnd]=points[i],a=rot,xx=px*Math.cos(a)-pz*Math.sin(a),zz=px*Math.sin(a)+pz*Math.cos(a),yy=py*Math.cos(tilt)-zz*Math.sin(tilt);zz=py*Math.sin(tilt)+zz*Math.cos(tilt);let q=1+zz*.22,rad=R*(mode===1?1.15:1)*q;if(mode===2){let ang=Math.atan2(yy,xx)+t*(.4+Math.abs(py));xx=Math.cos(ang)*(Math.abs(py)*.7+.2);yy=Math.sin(ang)*(Math.abs(py)*.7+.2)}if(mode===3){xx+=Math.sin(t*1.8+py*12)*.11;yy+=Math.cos(t+px*9)*.09}let X=cx+xx*rad*energy,Y=cy+yy*rad*energy,alpha=(.18+.72*(zz+1)/2)*(.5+rnd*.5);x.fillStyle=i%7===0?'rgba(255,110,220,'+alpha+')':'rgba(90,220,255,'+alpha+')';x.beginPath();x.arc(X,Y,(rnd*.85+.4)*(1+amp*2+burst),0,7);x.fill()}x.strokeStyle='rgba(85,215,255,.27)';x.lineWidth=1.1;for(let j=0;j<4;j++){x.save();x.translate(cx,cy);x.rotate(t*(j%2?-.12:.16)+j*1.5);x.scale(1,.32+j*.1);x.beginPath();x.ellipse(0,0,R*(1.16+j*.08)*energy,R*(1.16+j*.08)*energy,0,0,7);x.stroke();x.restore()}if(burst>.02){x.strokeStyle='rgba(160,235,255,'+burst*.8+')';x.lineWidth=3;x.beginPath();x.arc(cx,cy,R*(1.2+(1-burst)*2),0,7);x.stroke();burst*=.965}x.restore()}draw();
</script></html>
